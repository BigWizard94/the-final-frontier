<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>The Final Frontier</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="bars">
    <div class="bar"><div id="hp-fill" class="fill hp"></div><span id="hp-text">100</span></div>
    <div class="bar"><div id="en-fill" class="fill en"></div><span id="en-text">100</span></div>
  </div>
  <div id="hud-right">
    <div id="level-badge">LV <span id="level-num">1</span></div>
    <div id="credits">◈ <span id="credits-num">0</span></div>
  </div>
  <div id="quest-tracker" class="hidden"><span id="quest-title"></span><span id="quest-obj"></span></div>
</div>

<!-- Touch controls -->
<div id="touch" class="hidden">
  <div id="joystick"><div id="stick"></div></div>
  <div id="touch-buttons">
    <button id="btn-fire" class="tbtn hidden" aria-label="Fire blaster">✦</button>
    <button id="btn-attack" class="tbtn" aria-label="Attack">⚔</button>
    <button id="btn-talk" class="tbtn hidden" aria-label="Interact">!</button>
  </div>
</div>

<!-- Dialogue -->
<div id="dialogue" class="hidden">
  <div id="dlg-name"></div>
  <div id="dlg-text"></div>
  <div id="dlg-hint">tap / E to continue ▸</div>
</div>

<!-- Center banner messages -->
<div id="banner" class="hidden"></div>

<!-- Title screen -->
<div id="title">
  <div id="title-bg"></div>
  <div id="title-inner">
    <h1>THE FINAL<br>FRONTIER</h1>
    <p class="subtitle">A space colony RPG</p>
    <button id="btn-new" class="menu-btn">▶ New Expedition</button>
    <button id="btn-continue" class="menu-btn hidden">Continue</button>
    <p class="foot">v1.0 — free &amp; open source (MIT)</p>
  </div>
</div>

<!-- Game over / victory -->
<div id="gameover" class="hidden end-screen">
  <h2>SIGNAL LOST</h2>
  <p>Your colonist's vitals flatlined on an alien world.</p>
  <button id="btn-retry" class="menu-btn">Retry from last save</button>
  <button id="btn-title1" class="menu-btn ghost">Title screen</button>
</div>
<div id="victory" class="hidden end-screen">
  <h2>COLONY SECURED</h2>
  <p id="victory-text"></p>
  <button id="btn-again" class="menu-btn">Keep exploring</button>
  <button id="btn-title2" class="menu-btn ghost">Title screen</button>
</div>

<script src="js/core.js"></script>
<script src="js/tiles.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/main.js"></script>
</body>
</html>
